name: Continuous Integration

on:
  push:
    branches: [main, develop, alpha]
  pull_request:
    branches: [main, develop, alpha]

permissions:
  contents: read

jobs:
  lint:
    name: Check for linting errors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Set up npm
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm ci
      - name: Check for linting errors
        run: npm run lint

  format:
    name: Check for formatting errors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Set up npm
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm ci
      - name: Check for formatting errors
        run: npm run format:check

  test:
    name: Run unit tests for Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [lint, format]
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Set up npm
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm ci
      - name: Build vendored dependencies
        run: npm run build
      - name: Run unit tests
        run: npm test

  vscode:
    name: Run VS Code extension tests
    runs-on: ubuntu-latest
    needs: [lint, format]
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Set up npm
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm ci
      - name: Check for typing errors
        run: npm run typecheck
      - name: Build extension
        run: npm run build
      - name: Install Chromium for testing
        run: npx playwright install --with-deps chromium
      - name: Run web extension unit tests
        run: npm run test:web
