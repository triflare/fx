name: Verify npm trusted publishing

# TEMPORARY: manual one-shot check that the npm trusted publisher accepts this
# repository's OIDC identity and that `npm stage publish` works end to end.
# Stages a disposable version under a throwaway dist-tag; nothing goes live
# unless a maintainer approves it. Remove this workflow once verified.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Stage a disposable version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Set up npm
        # `npm stage` needs npm >= 11.15 and dist-tags over OIDC need >= 11.21.
        run: npm install --global npm@^11.21
      - name: Install dependencies
        run: npm ci
      - name: Build vendored dependencies
        run: npm run build
      - name: Stage a disposable version
        run: |
          npm pkg set version=0.0.0-oidc-verify
          npm stage publish --tag oidc-verify --provenance --access public
