# Identity
name: "Triflare Fx"
command: "fx"
version: "2.2.0-alpha.2"
tagline: "Code PenguinMod projects with text."
author: "Triflare"
homepage: "https://github.com/triflare/fx"

# Branding
branding:
  colors:
    primary: "#3CC6AB"
    secondary: "#16A085"
    tertiary: "#048E73"

# Terminal Glyphs
symbols:
  success: "✓"
  error: "✗"
  progress: "~"
  bullet: "•"

# Defaults
defaults:
  configFilename: "fx.yml"
  sourceExtension: ".tfx"
  sourceDirectory: "src"
  outputDirectory: "build"
